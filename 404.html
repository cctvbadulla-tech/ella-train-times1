<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Station Page Not Found | Ella Train Timetable &amp; Train Times</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="alternate icon" href="./favicon.ico">
  <script>
    // GitHub Pages SPA route redirect:
    // If a visitor accesses /ella-train-times/admin or /ella-train-times/timetable,
    // gracefully redirect to the base URL with hash anchor so the SPA handles it.
    (function() {
      var path = window.location.pathname;
      var repoBase = '/ella-train-times/';
      if (path.indexOf(repoBase) === 0 && path.length > repoBase.length) {
        var subRoute = path.substring(repoBase.length).replace(/\/$/, '');
        if (subRoute && subRoute.indexOf('.') === -1) {
          window.location.replace(repoBase + '#' + subRoute);
        }
      }
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #091b14;
      color: #fcfbf7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 500px;
      background: #0f281e;
      border: 1px solid #1b4332;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 1.75rem;
      color: #d4af37;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      color: #a7f3d0;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    a {
      display: inline-block;
      background: #d4af37;
      color: #091b14;
      font-weight: 700;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    a:hover {
      background: #fde047;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚂</div>
    <h1>Wrong Station Platform (404)</h1>
    <p>
      The timetable schedule page or route you are looking for has been moved or does not exist on <strong>ellatraintimes.com</strong>.
    </p>
    <a href="./" id="home-link">Return to Ella Railway Station Timetable</a>
  </div>
  <script>
    var homeLink = document.getElementById('home-link');
    if (homeLink) {
      var base = window.location.pathname.indexOf('/ella-train-times') !== -1 ? '/ella-train-times/' : './';
      homeLink.setAttribute('href', base);
    }
  </script>
</body>
</html>
